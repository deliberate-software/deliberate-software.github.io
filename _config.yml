# Deliberate Software — site settings
title: Deliberate Software
tagline: Made on purpose
legal_name: Deliberate Software LLC   # the LLC's exact registered name
description: >-
  Parker is a notes app for Mac that keeps track of who said what, about
  which project, and what you promised. Coming soon.
url: "https://deliberate.software"
baseurl: ""
lang: en

# Kit (kit.com) waitlist form.
# In Kit: open the form → Save & Publish → Embed → HTML tab.
# Copy the `action` URL from the <form> tag here exactly as Kit shows it.
kit:
  form_action: "https://app.kit.com/forms/10018273/subscriptions"

# Each app is one file in _apps/. Add a file to add an app.
collections:
  apps:
    output: false

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
