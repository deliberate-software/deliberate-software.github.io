<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- assign page_title = page.title | default: site.title -%}
{%- if page.title -%}{%- assign page_title = page.title | append: " · " | append: site.title -%}{%- endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#27282b" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/images/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>document.documentElement.classList.add("js");</script>
<script src="{{ '/assets/js/marks.js' | relative_url }}" defer></script>
