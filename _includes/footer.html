<footer class="site-footer">
  <div class="container footer">
    {% include lockup.html size="small" link=true %}
    <div class="footer__links">
      <a href="https://getpuli.com">Puli</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/trademarks/' | relative_url }}">Trademarks</a>
      <a href="{{ '/acknowledgements/' | relative_url }}">Acknowledgements</a>
      <a href="mailto:{{ site.email }}">Contact</a>
    </div>
    <p class="footer__copyright">© {{ site.time | date: "%Y" }} {{ site.legal_name }}</p>
    <p class="footer__trademarks">Deliberate Software and Puli are trademarks of {{ site.legal_name }}. For a list of all trademarks used on this site, see <a href="{{ '/trademarks/' | relative_url }}">Trademarks</a>.</p>
  </div>
</footer>
